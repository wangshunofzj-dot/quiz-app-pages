<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>题库练习 App</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./data/questions.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="shape shape-a" aria-hidden="true"></div>
    <div class="shape shape-b" aria-hidden="true"></div>
    <main class="app-shell">
      <header class="hero">
        <h1>题库练习 App</h1>
        <p>手机浏览器可用，支持错题集与错题高频强化。</p>
      </header>

      <section class="panel setup-panel">
        <h2>开始练习</h2>
        <div class="setup-grid">
          <div class="field">
            <label for="question-count">抽题数量</label>
            <input id="question-count" type="number" min="1" value="50" />
          </div>

          <div class="field">
            <label for="order-mode">出题顺序</label>
            <select id="order-mode">
              <option value="random">随机抽题</option>
              <option value="sequence">按原顺序</option>
            </select>
          </div>

          <div class="field">
            <label for="practice-mode">训练模式</label>
            <select id="practice-mode">
              <option value="smart">智能强化（错题更高概率）</option>
              <option value="normal">均匀随机</option>
              <option value="wrong-only">仅错题集</option>
            </select>
          </div>

          <div class="field type-field">
            <span>题型筛选</span>
            <div id="type-filters" class="type-filters"></div>
          </div>
        </div>
        <div class="setup-actions">
          <button id="start-btn" class="btn btn-primary">开始练习</button>
          <button id="start-wrong-btn" class="btn btn-warm">错题专项开始</button>
          <button id="reset-btn" class="btn btn-ghost">重置记录</button>
        </div>
      </section>

      <section class="panel stats-panel">
        <div class="stat">
          <span class="label">当前题号</span>
          <strong id="stat-progress">0 / 0</strong>
        </div>
        <div class="stat">
          <span class="label">客观题正确率</span>
          <strong id="stat-accuracy">0%</strong>
        </div>
        <div class="stat">
          <span class="label">已做题数</span>
          <strong id="stat-done">0</strong>
        </div>
        <div class="stat">
          <span class="label">错题数</span>
          <strong id="stat-wrong">0</strong>
        </div>
        <div class="stat">
          <span class="label">错题库总量</span>
          <strong id="stat-wrong-bank">0</strong>
        </div>
      </section>

      <section id="question-panel" class="panel question-panel hidden">
        <div class="question-top">
          <div class="meta-group">
            <span id="meta-type" class="chip"></span>
            <span id="meta-category" class="chip chip-soft"></span>
            <span id="meta-level" class="chip chip-soft"></span>
          </div>
          <div class="jump-group">
            <label for="jump-input">跳题</label>
            <input id="jump-input" type="number" min="1" value="1" />
            <button id="jump-btn" class="btn btn-mini">跳转</button>
          </div>
        </div>

        <h3 id="question-title"></h3>
        <pre id="question-stem" class="question-stem"></pre>

        <div id="options-wrap" class="options-wrap"></div>

        <div id="subjective-wrap" class="subjective-wrap hidden">
          <label for="subjective-note">你的答题思路（可选记录）</label>
          <textarea
            id="subjective-note"
            rows="5"
            placeholder="可以写你的关键步骤、沟通话术、判断依据..."
          ></textarea>
        </div>

        <div class="actions">
          <button id="check-btn" class="btn btn-primary">提交并判定</button>
          <button id="show-answer-btn" class="btn btn-ghost">查看答案/解析</button>
          <button id="prev-btn" class="btn btn-ghost">上一题</button>
          <button id="next-btn" class="btn btn-primary">下一题</button>
        </div>

        <div id="result-box" class="result-box hidden"></div>
      </section>

      <section class="panel wrongbook-panel">
        <div class="wrongbook-head">
          <h2>错题集</h2>
          <p id="wrongbook-summary">暂无错题。</p>
        </div>
        <div class="wrongbook-actions">
          <button id="export-wrong-btn" class="btn btn-ghost">导出错题JSON</button>
          <button id="clear-wrong-btn" class="btn btn-danger">清空错题集</button>
        </div>
        <div id="wrongbook-list" class="wrongbook-list"></div>
      </section>
    </main>
  </body>
</html>
